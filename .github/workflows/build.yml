name: build

on:
    push:
        branches:
            - live

    pull_request:
        branches:
            - live

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repo
              uses: actions/checkout@v5

            - name: Set up .NET
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "8.0.x"

            - name: Restore dependencies
              run: dotnet restore

            - name: Run the build
              run: dotnet build --configuration Release

            - name: Run tests
              run: dotnet test

            - name: Pack the project
              run: dotnet pack --configuration Release --no-restore --output ${{ github.workspace }}/nuget

            - name: Publish the NuGet package
              run: dotnet nuget push ${{ github.workspace }}/nuget/*.nupkg --api-key ${{ secrets.NUGET_APIKEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

            - name: Install the documentation tool
              run: dotnet tool update -g docfx

            - name: Generate the docs
              run: docfx docfx.json

            - name: Upload the docs
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "_site"

            - name: Deploy the docs to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
